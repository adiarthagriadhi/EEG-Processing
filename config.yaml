# Konfigurasi pipeline EEG–video (lihat EEG_PROCESSING.md). Semua parameter di sini,
# bukan di kode. Path relatif terhadap root repo.
is_simulated: false

paths:
  raw: data/raw                 # data/raw/PXX/{*Baseline*.EDF, *Trial*.EDF, *.webm}
  derivatives: data/derivatives # hasil antara per partisipan
  decisions: data/decisions     # keputusan manual per partisipan (PXX.yaml)
  reports: reports
  results: results
  participants: data/participants.csv   # participant_id, group, timepoint, age
  pose_model: models/pose_landmarker_full.task

eeg:
  sfreq: 100
  filter: {l_freq: 1.0, h_freq: 35.0}   # perangkat KT88 sudah LP ≈ 35 Hz, HP ≈ 0,5–1 Hz
  misc_channels: [Add_lead1, Add_lead2] # datar (terverifikasi P02)
  bad_z: 3.0                  # z robust log-SD saat istirahat
  max_bad: 3                  # lebih dari ini → berhenti untuk ditinjau
  montage: standard_1020

video:
  hud_box: [960, 270, 1280, 449]          # x0, y0, x1, y1 (terverifikasi P02)
  participant_box: [340, 90, 740, 640]    # area partisipan tanpa operator (P02)
  ocr_coarse_step_sec: 0.5   # OCR kasar + pencarian biner di sekitar perubahan label
  trajectory: trunk_y         # bahu+pinggul; derau pelacakan lebih kecil dari pinggul saja (P10)
  pose_frame_step: 2         # 15 fps: ~5 mnt/partisipan; presisi waktu ~66 ms

sync:
  # PENDEKATAN v2 (keputusan pengguna 2026-09-23): waktu fase SEPENUHNYA dari video; EEG dipetakan
  # dengan offset TETAP (keterlambatan sistem, median 11 partisipan 0,48–1,23 dtk, SD 0,2; DIBEKUKAN).
  # Estimasi berbasis data (xcorr + cek onset) hanya ALARM: penyimpangan besar yang didukung bukti
  # → berhenti untuk keputusan manual (data/decisions/PXX.yaml, method: manual). mode: auto = cara lama.
  mode: fixed
  fixed_offset_sec: 0.85
  alarm_dev_sec: 1.0          # |estimasi − offset tetap| > ini (dtk) DAN ada bukti → alarm
  alarm_min_r: 0.10           # bukti: r puncak kasar minimal (P35: r 0,01 → tanpa bukti)
  alarm_max_se: 0.30          # bukti: SE offset per-repetisi maksimal
  fs: 20.0
  coarse_lag_sec: 60.0        # boxcar HUD vs EEG (lihat EEG_PROCESSING.md 7)
  fine_lag_sec: 2.0           # gerak video vs EEG di sekitar hasil kasar
  prior_max_abs_sec: 5.0      # start manual pada hitungan ke-3
  min_peak_margin: 0.03
  min_r_fine: 0.25
  max_spread_sec: 0.5         # PERINGATAN saja; IQR antar 6 kombinasi sinyal (rentang penuh sensitif thd 1 sinyal lemah; P10)
  eeg_motion_channels: [Fp1, Fp2, F7, F8, T3, T4]
  eeg_motion_band: [20.0, 34.0]
  rep_lag_sec: 1.0            # jendela sempit per-repetisi (langkah 2)
  min_reps: 6                 # offset utama = median per-repetisi (P01/P03/P04)
  max_se_sec: 0.25            # SE median offset per-repetisi (P02 0,08; P01–P04 0,18–0,23)
  onset_check:                # validasi onset-ke-onset setelah fase (lihat sync.onset_check)
    k_mad: 6.0
    min_n: 5                  # repetisi dengan onset EEG terdeteksi
    max_iqr_sec: 0.6          # konsistensi antar repetisi
    max_abs_lag_sec: 0.5      # mode auto: |lag| lebih besar → offset dikoreksi (offset += lag)
    alarm_lag_sec: 1.0        # mode fixed: |lag| lebih besar (n, IQR memenuhi) → alarm
    dismiss_min_n: 3          # alarm xcorr DIBANTAH bila onset pada offset tetap cocok (|lag| ≤
    dismiss_max_lag_sec: 0.5  #   0,5 dtk, n ≥ 3). P34: xcorr +33 dtk, onset pada 0,85 = −0,15 dtk (n 4)
  max_drift_sec: 0.3         # resolusi ~0,05 dtk; puncak xcorr lebar (gerak 2–3 dtk)

phases:
  # Protokol panel (software, hitungan 1–8 @1 dtk; terverifikasi P02): TURUN 1–3,
  # TAHAN 4–5, NAIK 6–8. Batas HUD diturunkan dari onset TURUN (paling andal di OCR).
  hud_protocol: {TURUN: 0.0, TAHAN: 3.0, NAIK: 5.0, END: 8.0}
  search_before_sec: 1.0     # jendela pencarian relatif HUD TURUN
  search_after_sec: 3.0      # setelah akhir HUD NAIK
  late_sec: 3.0              # mulai turun setelah fase TURUN HUD berakhir (P02: latensi tipikal 1,2–1,7 dtk)
  baseline_max_frac: 0.2     # rentang gerak di jendela baseline < 20% kedalaman gerak
  short_hold_sec: 1.0
  min_depth_px: 15
  max_track_noise_px: 3.0    # median |Δy| antar frame; di atas ini pose dianggap tidak andal
  default_latency_sec: 1.2
  arm_search_sec: 8.0         # cari gerak lengan mulai 8 dtk sebelum instruksi TURUN

erd:
  # Baseline dimundurkan agar tidak tumpang tindih jendela PRA-gerak (−2…0 dtk; permintaan
  # pengguna). −5…−3 dtk dari onset aktual = periode BERDIRI RILEKS/BERSIAP (diam).
  tmin: -7.5                  # epoch dikunci GERAK PERTAMA (lengan)
  baseline: [-6.0, -4.0]      # periode BERDIRI RILEKS, relatif gerak pertama
  pre_window: [-2.0, 0.0]     # fase PRA: 2 dtk sebelum gerak pertama (lengan)
  post_window: [0.5, 2.0]     # beta rebound: setelah NAIK selesai (berdiri diam)
  min_phase_sec: 0.5
  freqs: [4, 30]
  bands: {theta: [4, 8], mu: [8, 13], beta: [13, 30]}
  roi: [C3, C4, P3, P4, O1, O2, F3, F4]

segments:
  # Tahap `segmen` (pendekatan v2): semua segmen dari video dipakai (TAHAN singkat TETAP dipakai),
  # batas fase dipangkas, acuan GABUNGAN per partisipan (jendela paling diam dari video).
  phases: [PRA, TURUN, TAHAN, NAIK, POST]   # PRA = −2…0 dtk sebelum gerak pertama; POST = akhir+0,5…+2
  trim_sec: 0.25              # pangkas tiap batas fase gerak …
  trim_max_frac: 0.15         # … paling banyak 15% durasi fase
  min_win_sec: 0.3            # jendela terpangkas < ini → tanpa nilai EEG (durasi tetap dicatat)
  include_hud_fallback: true  # repetisi fallback protokol (pose tidak andal) dipakai, ditandai
  baseline_tasks: [BERDIRI RILEKS, ISTIRAHAT UTAMA]
  baseline_win_sec: 2.0
  baseline_step_sec: 1.0
  baseline_quiet_frac: 0.5    # 50% jendela dengan gerak tubuh (video) terendah
  min_segments_flag: 6        # < ini per subfase → ditandai (tidak dibuang)
  noise_inject_db: 8.0
  areas:
    frontopolar: [Fp1, Fp2]
    frontal: [F3, F4]
    frontotemporal: [F7, F8]
    sentral: [C3, C4]
    temporal: [T3, T4]
    parietal: [P3, P4]
    temporo-posterior: [T5, T6]
    oksipital: [O1, O2]
  artifact_prone: [frontopolar, frontotemporal, temporal]   # tidak ditafsirkan sebagai kortikal
  romberg_reject_uv: 150.0

romberg:
  pad_sec: 1.0              # buang transisi (tutup/buka mata) di awal & akhir segmen
  reject_uv: 150.0          # peak-to-peak per epoch 2 dtk (standar; jangan dilonggarkan agar lolos)
  min_clean_sec: 2.0         # pakai data yang tersedia (≥ 1 epoch 2 dtk); detik terpakai dilaporkan
  labels: {EO: BERDIRI FOKUS MATA TERBUKA, EC: BERDIRI MATA TERTUTUP}

# Hipotesis eksploratif (ditetapkan 2026-09-23 dari P02/P10, SEBELUM data lengkap dianalisis).
# Diuji pada tingkat grup (Welch, satu arah sesuai 'expect', FDR atas H1–H5).
# Efek per partisipan di bawah noise_floor_db (uji noise buatan) tidak ditafsirkan sendiri.
hypotheses:
  H1: {label: "Neural efficiency: perubahan tonjolan mu kontralateral lebih kecil pada penari",
       endpoint: mu_periodic_contra_abs_TAHAN, expect: penari < non-penari}
  H2: {label: "Kestabilan motorik: kenaikan garis latar global lebih kecil pada penari",
       endpoint: global_offset_TAHAN, expect: penari < non-penari}
  H3: {label: "Kontrol postural: durasi menahan agem lebih panjang pada penari",
       endpoint: hold_agem_sec, expect: penari > non-penari}
  H4: {label: "Tahap kognitif: penurunan mu fronto-parietal kiri lebih luas pada non-penari",
       endpoint: mu_relative_FCP_left_TURUN, expect: non-penari < penari}
  H5: {label: "Postur/skema tubuh: lateralisasi kanan saat TAHAN pada penari",
       endpoint: mu_relative_right_minus_left_TAHAN, expect: penari < non-penari}

# Hipotesis v2 (ditetapkan 2026-09-23 dari EKSPLORASI 11 partisipan: P01–P07, P10, P36–P38;
# lihat CLAUDE.md "Audit segmen"). Kerangka subsegmen dari pengguna: TURUN = koordinasi/stabilitas
# dinamis; TAHAN = kontrol keseimbangan/kekuatan; NAIK = gerak sehari-hari (kontrol internal).
# UJI KONFIRMATORI hanya pada partisipan BARU (di luar 11 partisipan eksplorasi) untuk menghindari
# sirkularitas; hasil pada seluruh sampel dilaporkan terpisah. Welch satu arah per 'expect', FDR atas
# H6–H13. Endpoint dihitung dengan pendekatan baru (offset tetap 0,85 dtk, 12 segmen gabungan,
# acuan gabungan). BELUM diimplementasikan di eegpipe/hypotheses.py (paket kerja berikutnya).
hypotheses_v2:
  H6:  {label: "TURUN terkontrol: durasi turun lebih panjang pada penari",
        endpoint: dur_turun_sec, expect: penari > non-penari, explor_d: 0.75}
  H7:  {label: "TAHAN konsisten: variabilitas (CV) durasi tahan lebih kecil pada penari",
        endpoint: cv_tahan, expect: penari < non-penari, explor_d: -2.12}
  H8:  {label: "NAIK efisien: durasi naik lebih singkat pada penari",
        endpoint: dur_naik_sec, expect: penari < non-penari, explor_d: -2.34}
  H9:  {label: "Efisiensi kortikal TURUN: ERD mu periodik sentral (C3/C4) lebih kecil pada penari",
        endpoint: mu_periodic_central_TURUN, expect: penari > non-penari, explor_d: 1.75}
  H10: {label: "Kestabilan motorik: kenaikan garis latar sentral lebih kecil pada penari (TURUN, TAHAN)",
        endpoint: [offset_central_TURUN, offset_central_TAHAN], expect: penari < non-penari, explor_d: [-0.90, -0.87]}
  H11: {label: "Kontrol keseimbangan TAHAN: mu periodik temporo-posterior/parietal lebih rendah pada penari",
        endpoint: mu_periodic_posterior_TAHAN, expect: penari < non-penari, explor_d: -2.00}
  H12: {label: "Spesifisitas tuntutan gerak: kenaikan garis latar sentral TURUN/TAHAN relatif NAIK lebih kecil pada penari",
        endpoint: demand_minus_naik_offset_central, expect: penari < non-penari}
  H13: {label: "Hubungan otak–perilaku: garis latar TAHAN berkorelasi dengan CV durasi tahan (seluruh sampel, kontrol usia bila ada)",
        endpoint: [offset_central_TAHAN, cv_tahan], expect: "rho > 0"}

# Partisipan yang dipakai MEMBENTUK H6–H13 (eksplorasi 2026-09-23). Uji konfirmatori = partisipan lain.
exploration_set: [P01, P02, P03, P04, P05, P06, P07, P10, P36, P37, P38]

# Tujuan utama: regresi dosis-respons durasi menari (tahun) vs kontrol gerak, dikontrol usia.
# Membutuhkan kolom dance_years & age di data/participants.csv (belum diisi per 2026-09-24).
dose_response:
  predictor: dance_years
  covariates: [age]
  outcomes: [cv_tahan, dur_naik_sec, dur_turun_sec, offset_central_TURUN, offset_central_TAHAN,
             mu_periodic_central_TURUN, mu_periodic_posterior_TAHAN]
  min_n: 8
