# Konfigurasi pipeline EEG–video (lihat EEG_PROCESSING.md). Semua parameter di sini,
# bukan di kode. Path relatif terhadap root repo.
is_simulated: false

paths:
  raw: data/raw                 # data/raw/PXX/{*Baseline*.EDF, *Trial*.EDF, *.webm}
  derivatives: data/derivatives # hasil antara per partisipan
  decisions: data/decisions     # keputusan manual per partisipan (PXX.yaml)
  reports: reports
  results: results
  participants: data/participants.csv   # participant_id, group, timepoint, age
  pose_model: models/pose_landmarker_full.task

eeg:
  sfreq: 100
  filter: {l_freq: 1.0, h_freq: 35.0}   # perangkat KT88 sudah LP ≈ 35 Hz, HP ≈ 0,5–1 Hz
  misc_channels: [Add_lead1, Add_lead2] # datar (terverifikasi P02)
  montage: standard_1020

video:
  hud_box: [960, 270, 1280, 449]          # x0, y0, x1, y1 (terverifikasi P02)
  participant_box: [340, 90, 740, 640]    # area partisipan tanpa operator (P02)
  ocr_coarse_step_sec: 0.5   # OCR kasar + pencarian biner di sekitar perubahan label
  pose_frame_step: 2         # 15 fps: ~5 mnt/partisipan; presisi waktu ~66 ms

sync:
  fs: 10.0
  coarse_lag_sec: 60.0        # boxcar HUD vs EEG (lihat EEG_PROCESSING.md 7)
  fine_lag_sec: 2.0           # gerak video vs EEG di sekitar hasil kasar
  prior_max_abs_sec: 5.0      # start manual pada hitungan ke-3
  min_peak_margin: 0.03
  min_r_fine: 0.2
  eeg_motion_channels: [Fp1, Fp2, F7, F8, T3, T4]
  eeg_motion_band: [20.0, 34.0]
  max_drift_sec: 0.2

phases:
  # Protokol panel (software, hitungan 1–8 @1 dtk; terverifikasi P02): TURUN 1–3,
  # TAHAN 4–5, NAIK 6–8. Batas HUD diturunkan dari onset TURUN (paling andal di OCR).
  hud_protocol: {TURUN: 0.0, TAHAN: 3.0, NAIK: 5.0, END: 8.0}
  search_before_sec: 1.0     # jendela pencarian relatif HUD TURUN
  search_after_sec: 3.0      # setelah akhir HUD NAIK
  late_sec: 1.5
  short_hold_sec: 1.0
  min_depth_px: 15

erd:
  tmin: -2.5
  baseline: [-2.0, -0.5]
  min_phase_sec: 0.5
  freqs: [4, 30]
  bands: {theta: [4, 8], mu: [8, 13], beta: [13, 30]}
  roi: [C3, C4, P3, P4, O1, O2, F3, F4]

romberg:
  pad_sec: 2.0
  min_clean_sec: 20.0
  labels: {EO: BERDIRI FOKUS MATA TERBUKA, EC: BERDIRI MATA TERTUTUP}
